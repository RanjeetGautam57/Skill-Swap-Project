        body {
            background: #c9c7c7;

        }

        .row {
            min-height: 400px;

        .reg {
            min-height: 500px;

        }

            color: #55361e;

            font-size: 35px;
        }
        
         input {
            background-color: #ead5c4 !important;
            border: 2px solid #55361e !important;


        }
        .slt{
            height: 40px !important;
           
            
        }
        .btn{
            background: #55361e !important;
            color: #f4d0b2;
            font-weight: bold;
        }
        span{
            font-size: 17px !important;
            font-weight: bold;
            color: #55361e;
        }
        
    </style>
</head>

<body style="background-color: #245F73;">
    <div class="container">
        <div class="row">
            <div class="col-sm-6 mx-auto  reg">

                <h4 class="text-center mb-4 ">Start Your Journey</h4>

                <form id="registrationForm" class="mx-auto">
                    <label for="" class="ms-5 fw-semibold fs-5 ps-2 " style="color: #55361e;">Full Name</label> <br>
                    <input type="text" class="form-control ms-5 w-75 " placeholder="Full Name" required id="i1">
                    <label for="" class="ms-5 fw-semibold fs-5 ps-2 mt-2" style="color: #55361e;">Email</label> <br>
                    <input type="text" class="form-control ms-5 w-75" placeholder="Email" required id="i2">
                    <label for="" class="ms-5 fw-semibold fs-5 ps-2 mt-2" style="color: #55361e;">Password</label> <br>
                    <input type="password" class="form-control ms-5 w-75" placeholder="Password" required id="i3">
                    <label for="" class="ms-5 fw-semibold fs-5 ps-2 mt-2" style="color: #55361e;">Confirm Password</label> <br>
                    <input type="password" class="form-control ms-5 w-75" placeholder="Confirm Password" required id="i4">
                    <span class=" mt-5 mx-5">A skill you can teach</span>
                    <select  id="teachSkill" class="mt-2 ms-5 border-0 w-75 slt" style="background-color: #ead5c4;" required>
                        
                        <option>Programming</option>
                        <option>Web Development</option>
                        <option>Data Analysis</option>
                        <option>Cloud Computing</option>
                        <option>Cyber Security</option>
                        <option>Networking and IT Support</option>
                        <option>Database Management</option>
                        <option>Communication</option>
                        <option>Leadership</option>
                        <option>Teamwork and collaboration</option>
                        <option>Time management</option>
                        <option>Presentation skills</option>
                        <option>Conflict resolution</option>
                    </select><br>
                     <span class=" mx-5">A skill you want to learn</span>
                    <select   id="learnSkill" class="mt-2 ms-5 border-0 w-75 slt mb-0" style="background-color: #ead5c4;" required >
                        
                        <option>Programming</option>
                        <option>Web Development</option>
                        <option>Data Analysis</option>
                        <option>Cloud Computing</option>
                        <option>Cyber Security</option>
                        <option>Networking and IT Support</option>
                        <option>Database Management</option>
                        <option>Communication</option>
                        <option>Leadership</option>
                        <option>Teamwork and collaboration</option>
                        <option>Time management</option>
                        <option>Presentation skills</option>
                        <option>Conflict resolution</option>
                    </select>
                    <p class="mx-5 mt-1 fw-bold" style="font-size: 14px !important;">You can add more skills later from your dashboard</p>
                    <button type="submit" class="btn w-75 mx-5 border-0" onclick="register()">Create Account</button>
                    <p class="text-center">Already on the board?<a href="Login.html" style="color: rgb(34, 99, 101);font-weight: bold;text-decoration: none;">Log in</a></p>
                    
                </form>
    
            </div>

        </div>
    </div>

    <script src="js/registration.js"></script>
